name: aipaste
options:
  bundleIdPrefix: com.eden
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  aipaste:
    type: application
    platform: macOS
    sources:
      - path: aipaste
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eden.aipaste
        PRODUCT_NAME: aipaste
        INFOPLIST_FILE: aipaste/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: aipaste/Resources/aipaste.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: VG5N83JSPL
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
          ENABLE_HARDENED_RUNTIME: NO
    scheme:
      testTargets:
        - aipasteTests
  aipasteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: aipasteTests
    dependencies:
      - target: aipaste
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eden.aipaste.tests
        PRODUCT_NAME: aipasteTests
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
